name: Build & Auto-Release Beta APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-beta:
    name: Build APK & Publish Beta Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Repository (Full History & Tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure debug.keystore & .env exist for CI Build
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Restore Release Keystore (Optional if Secrets Configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "HAS_RELEASE_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Calculate Next Sequential Beta Tag (beta-0.1, beta-0.2, ...)
        id: next_version
        run: |
          git fetch --tags --force
          LATEST_MINOR=$(git tag -l "beta-0.*" | sed -E 's/^beta-0\.([0-9]+)$/\1/' | grep -E '^[0-9]+$' | sort -n | tail -n 1)
          if [ -z "$LATEST_MINOR" ]; then
            NEXT_MINOR=1
          else
            NEXT_MINOR=$((LATEST_MINOR + 1))
          fi
          TAG_NAME="beta-0.${NEXT_MINOR}"
          RELEASE_TITLE="beta 0.${NEXT_MINOR}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "next_minor=${NEXT_MINOR}" >> "$GITHUB_OUTPUT"
          echo "Computed next release: ${RELEASE_TITLE} (tag: ${TAG_NAME})"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build Signed Release APK (When Release Keystore Secrets Exist)
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Prepare Release Artifacts (APK & Source Code Archive)
        env:
          TAG_NAME: ${{ steps.next_version.outputs.tag_name }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/SJP-Pulse-${TAG_NAME}-debug.apk"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-assets/SJP-Pulse-${TAG_NAME}-release.apk"
          fi
          git archive --format=zip --output="release-assets/SJP-Pulse-${TAG_NAME}-source.zip" HEAD

      - name: Create Git Tag & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.next_version.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.next_version.outputs.release_title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "Automated release ${RELEASE_TITLE}"
          git push origin "${TAG_NAME}"

          gh release create "${TAG_NAME}" \
            release-assets/* \
            --title "${RELEASE_TITLE}" \
            --notes "Automated build and source release **${RELEASE_TITLE}** (\`${TAG_NAME}\`) generated from commit \`${GITHUB_SHA::7}\`." \
            --prerelease
