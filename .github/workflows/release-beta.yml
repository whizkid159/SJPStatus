name: Build & Auto-Release Beta (APK + Source Code)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-beta:
    name: Build SJP Pulse APK & Publish Beta Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository with Full History & Tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Write License Hashes
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "${SDK_DIR}/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "${SDK_DIR}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "${SDK_DIR}/licenses/android-sdk-preview-license"
          printf "\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "${SDK_DIR}/licenses/android-sdk-arm-dbt-license"
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "${SDK_DIR}/licenses/android-googletv-license"
          printf "\nceff83576aac4f7f37cb98fe189e9fb3c49d3b81\n" > "${SDK_DIR}/licenses/android-googlexr-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "${SDK_DIR}/licenses/google-gdk-license"
          printf "\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d\n" > "${SDK_DIR}/licenses/mips-android-sysimage-license"
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "Configured Android SDK at ${SDK_DIR}"

      - name: Install Gradle 9.3.1
        run: |
          GRADLE_VER="9.3.1"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
          sudo mkdir -p /opt/gradle-dist
          sudo unzip -q -o /tmp/gradle.zip -d /opt/gradle-dist
          echo "/opt/gradle-dist/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"
          /opt/gradle-dist/gradle-${GRADLE_VER}/bin/gradle --version

      - name: Prepare Debug & Release Signing Keystores (Android 16 Compatible)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Always ensure a valid release keystore exists so assembleRelease builds a non-debuggable
          # production APK that Android 16 Advanced Protection & OEM blockers allow to open.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${SECRET_STORE_PASS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${SECRET_KEY_PASS}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -storepass sjppulse2026 \
              -alias upload \
              -keypass sjppulse2026 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SJP Pulse Release,O=SJP Pulse,C=PK"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=sjppulse2026" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=sjppulse2026" >> "$GITHUB_ENV"
          fi

          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Determine Next Sequential Beta Tag, Title & Description
        id: meta
        run: |
          git fetch --tags --force || true
          EXISTING_TAGS=$(git tag -l "beta-0.*" || true)
          LATEST_MINOR=0
          for t in $EXISTING_TAGS; do
            num="${t#beta-0.}"
            if [[ "$num" =~ ^[0-9]+$ ]]; then
              if (( num > LATEST_MINOR )); then
                LATEST_MINOR=$num
              fi
            fi
          done

          NEXT_MINOR=$((LATEST_MINOR + 1))
          TAG_NAME="beta-0.${NEXT_MINOR}"
          BETA_LABEL="beta 0.${NEXT_MINOR}"
          RELEASE_TITLE="beta 0.${NEXT_MINOR} — SJP Pulse (Android 7–16 Release APK + Source Code)"
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          SHORT_SHA="${GITHUB_SHA:0:7}"

          if [ "$LATEST_MINOR" -gt 0 ]; then
            PREV_TAG="beta-0.${LATEST_MINOR}"
            COMMIT_LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" 2>/dev/null || git log -n 10 --pretty=format:"- %s (%h)")
          else
            COMMIT_LOG=$(git log -n 10 --pretty=format:"- %s (%h)" 2>/dev/null || echo "- Initial beta release (${SHORT_SHA})")
          fi
          if [ -z "$COMMIT_LOG" ]; then
            COMMIT_LOG="- Automated build from commit ${SHORT_SHA}"
          fi

          {
            echo "# SJP Pulse — Release ${BETA_LABEL}"
            echo ""
            echo "Automated Android application and source code release triggered from branch \`${GITHUB_REF_NAME}\` at commit \`${SHORT_SHA}\` on **${BUILD_DATE}**."
            echo ""
            echo "## Release Metadata"
            echo "- **Tag**: \`${TAG_NAME}\` (\`${BETA_LABEL}\`)"
            echo "- **Title**: ${RELEASE_TITLE}"
            echo "- **Application ID**: \`com.aistudio.sjppulse.vktrqm\`"
            echo "- **Android Compatibility**: Android 7.0 (API 24) through Android 16 (API 36)"
            echo "- **Commit SHA**: \`${GITHUB_SHA}\`"
            echo ""
            echo "## Attached Deliverables (Application & Source Code)"
            echo "- **Production Signed Release APK**: \`SJP-Pulse-${TAG_NAME}.apk\` *(Recommended for Android 14/15/16 devices)*"
            echo "- **Debug APK**: \`SJP-Pulse-${TAG_NAME}-debug.apk\`"
            echo "- **Source Code (ZIP)**: \`SJP-Pulse-${TAG_NAME}-source.zip\`"
            echo "- **Source Code (TAR.GZ)**: \`SJP-Pulse-${TAG_NAME}-source.tar.gz\`"
            echo ""
            echo "## Key Features"
            echo "- **Native In-App Login (CNIC & Password)**: Authenticates directly from the app using a headless background browser & API bridge."
            echo "- **Smart Job Recommendations & In-App Apply**: Suggests open SJP jobs matched to your education, major, domicile, and age, with an Eligibility Match Breakdown & one-tap application submission."
            echo "- **Hidden Backend Status Radar & 30-Min Poller**: Polls all pages of \`usr-svc.sjp.gos.pk/api/v2/candidates/application/getAllAppliedJobsByCandidate\` and sends push notifications on status transitions."
            echo ""
            echo "## Commits in This Release"
            echo "${COMMIT_LOG}"
          } > release-notes.md

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "beta_label=${BETA_LABEL}" >> "$GITHUB_OUTPUT"

      - name: Compile Production Release APK & Debug APK
        run: gradle :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Package Application APKs & Source Code Archives
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        run: |
          mkdir -p release-assets

          REL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1 || true)
          DBG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1 || true)

          if [ -n "$REL_APK" ]; then
            cp "$REL_APK" "release-assets/SJP-Pulse-${TAG_NAME}.apk"
          elif [ -n "$DBG_APK" ]; then
            cp "$DBG_APK" "release-assets/SJP-Pulse-${TAG_NAME}.apk"
          else
            echo "Error: No APK found in app/build/outputs/apk/"
            exit 1
          fi

          if [ -n "$DBG_APK" ]; then
            cp "$DBG_APK" "release-assets/SJP-Pulse-${TAG_NAME}-debug.apk"
          fi

          git archive --format=zip --prefix="SJP-Pulse-${TAG_NAME}/" --output="release-assets/SJP-Pulse-${TAG_NAME}-source.zip" HEAD
          git archive --format=tar.gz --prefix="SJP-Pulse-${TAG_NAME}/" --output="release-assets/SJP-Pulse-${TAG_NAME}-source.tar.gz" HEAD

          ls -lh release-assets/

      - name: Create Annotated Git Tag & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.meta.outputs.release_title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -F release-notes.md -f
          git push origin "${TAG_NAME}" --force

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release delete "${TAG_NAME}" --yes || true
          fi

          gh release create "${TAG_NAME}" \
            release-assets/* \
            --title "${RELEASE_TITLE}" \
            --notes-file release-notes.md \
            --prerelease
